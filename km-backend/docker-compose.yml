version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000"
    # Every setting and secret (MONGO_URI, DATABASE_URI, JWT_SECRET, ...) comes from .env,
    # which is never committed
    env_file:
      - .env
    environment:
      # A container always runs in production mode (secure cookies, no test shortcuts), even
      # if the .env next to it was copied from a development machine
      - ENVIRONMENT=production
    volumes:
      - km-statics:/root/static/uploads

volumes:
  km-statics:
