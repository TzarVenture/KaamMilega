<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 360 252" fill="none">
  <!-- ground line of dashed reach arcs -->
  <path d="M300 210 Q 330 160 316 110" stroke="#93C5FD" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>

  <!-- phone -->
  <rect x="110" y="30" width="148" height="270" rx="22" fill="#0E2A6B" stroke="#2B4C9B" stroke-width="2"/>
  <rect x="118" y="38" width="132" height="262" rx="16" fill="#F8FAFC"/>
  <rect x="160" y="44" width="48" height="6" rx="3" fill="#CBD5E1"/>

  <!-- feed post above the ad -->
  <circle cx="134" cy="68" r="8" fill="#93C5FD"/>
  <rect x="148" y="63" width="56" height="5" rx="2.5" fill="#94A3B8"/>
  <rect x="148" y="72" width="36" height="4" rx="2" fill="#CBD5E1"/>

  <!-- the ad card -->
  <rect x="126" y="88" width="116" height="150" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <rect x="126" y="88" width="116" height="64" rx="12" fill="#FF6B00"/>
  <rect x="126" y="140" width="116" height="12" fill="#FF6B00"/>
  <!-- ad picture: briefcase on orange -->
  <rect x="166" y="106" width="36" height="28" rx="5" fill="#FFFFFF"/>
  <rect x="176" y="100" width="16" height="8" rx="3" stroke="#FFFFFF" stroke-width="3"/>
  <rect x="166" y="117" width="36" height="3" fill="#FFD3B0"/>
  <!-- company line -->
  <rect x="136" y="162" width="16" height="16" rx="4" fill="#071A4D"/>
  <rect x="158" y="164" width="48" height="5" rx="2.5" fill="#334155"/>
  <rect x="158" y="173" width="30" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="136" y="188" width="94" height="5" rx="2.5" fill="#94A3B8"/>
  <rect x="136" y="198" width="70" height="5" rx="2.5" fill="#CBD5E1"/>
  <!-- call to action -->
  <rect x="136" y="212" width="96" height="16" rx="8" fill="#0B5ED7"/>
  <rect x="164" y="218" width="40" height="4" rx="2" fill="#FFFFFF"/>

  <!-- megaphone -->
  <g transform="translate(20 108) rotate(-14)">
    <rect x="0" y="22" width="22" height="26" rx="5" fill="#FF6B00"/>
    <path d="M22 22 L72 0 L72 70 L22 48 Z" fill="#FFFFFF"/>
    <rect x="70" y="-4" width="10" height="78" rx="5" fill="#FDBA74"/>
    <rect x="8" y="46" width="12" height="24" rx="4" fill="#C2410C"/>
    <path d="M92 18 L106 10" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
    <path d="M94 35 L112 35" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
    <path d="M92 52 L106 60" stroke="#FCD34D" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- views chip -->
  <g transform="translate(250 58)">
    <rect width="96" height="40" rx="12" fill="#FFFFFF"/>
    <circle cx="20" cy="20" r="11" fill="#DBEAFE"/>
    <path d="M12 20 Q20 12 28 20 Q20 28 12 20 Z" fill="#0B5ED7"/>
    <circle cx="20" cy="20" r="3" fill="#FFFFFF"/>
    <rect x="38" y="12" width="44" height="7" rx="3.5" fill="#071A4D"/>
    <rect x="38" y="24" width="28" height="5" rx="2.5" fill="#CBD5E1"/>
  </g>

  <!-- clicks chip with a small rising chart -->
  <g transform="translate(262 134)">
    <rect width="86" height="76" rx="12" fill="#FFFFFF"/>
    <rect x="12" y="44" width="10" height="20" rx="2" fill="#99F6E4"/>
    <rect x="28" y="34" width="10" height="30" rx="2" fill="#5EEAD4"/>
    <rect x="44" y="24" width="10" height="40" rx="2" fill="#14B8A6"/>
    <rect x="60" y="12" width="10" height="52" rx="2" fill="#0F9D8A"/>
    <path d="M14 30 L32 22 L48 16 L66 6" stroke="#FF6B00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- tick: approved -->
  <g transform="translate(98 214)">
    <circle cx="16" cy="16" r="16" fill="#16A34A"/>
    <path d="M9 16 L14 21 L23 11" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
